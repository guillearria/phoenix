name: listen
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listen
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s listen -p "test_*.py"
      - name: Listen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          READ_TOKEN: ${{ secrets.READ_TOKEN }}
        run: python listen/listen.py
      - name: Model prices
        if: always()
        run: python models/check.py
      - name: Commit
        if: always()
        run: |
          git config user.name "phoenix-listen"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/signals.csv STATE.md MODELS.md
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "listen $(date -u +%F): ledger and STATE updated"
          git push
